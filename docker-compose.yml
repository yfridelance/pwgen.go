services:
  pwgen:
    build: .
    ports:
      - "5069:5069"
    environment:
      - MULTI_GEN=true
      - HIBP_ENABLED=true
      - DEFAULT_LENGTH=16
    restart: unless-stopped

  frontend:
    build: ./web
    ports:
      - "5070:80"
    depends_on:
      - pwgen
    restart: unless-stopped
